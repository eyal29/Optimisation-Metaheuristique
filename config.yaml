# ============================
# Configuration générale
# ============================

paths:
  videos: "datasets/videos.csv"
  vms: "datasets/machines_virtuelles.csv"

# ============================
# GWO Configuration
# ============================

gwo:
  population_size: 200       # taille de la population
  max_iter: 150               # nombre d'itérations
  a_max: 2.0
  a_min: 0.0
  max_archive_size: 200       # taille max de l'archive Pareto 
  
  # Paramètres d'arrêt précoce (early stopping)
  early_stopping_threshold: 0.001   # 0.1% d'amélioration minimale
  early_stopping_patience: 30       # nombre d'itérations sans amélioration avant arrêt


# ============================
# Contraintes
# ============================

constraints:
  lmax: false
  

